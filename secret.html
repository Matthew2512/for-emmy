<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secret 🔒</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#E8779A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="For Emmy" />
</head>
<body>

  <div class="scene">

    <!-- Card 1: password gate -->
    <section class="card" id="lock-card">
      <p class="eyebrow">shh</p>
      <h1>Got a password?</h1>
      <p class="subtext">This one's locked. You'll know it if you know it.</p>

      <form class="wishlist-form" id="lock-form">
        <input type="password" id="lock-input" placeholder="Password" autocomplete="off" required />
        <button type="submit">Unlock</button>
      </form>

      <p class="wishlist-status" id="lock-error" hidden>That's not it — try again.</p>
    </section>

    <!-- Card 2: the secret -->
    <section class="card card--video" id="secret-card">
      <p class="eyebrow">just for you</p>
      <h2>a little secret</h2>

      <div class="audio-wrap">
        <audio id="secret-audio" controls>
          Sorry, your browser can't play this audio.
        </audio>
      </div>

      <a href="index.html" class="home-link">← back home</a>
    </section>

  </div>

  <script src="secret.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
